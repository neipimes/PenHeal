# Model and endpoint configuration for PenHeal
# Priority: explicit runtime config > env vars > this file

llm:
  provider: openai
  api_key: ""
  api_base: ""
  model_name: "gpt-4o"
  temperature: 0.3
  timeout: 60

embeddings:
  provider: openai
  api_key: ""
  api_base: ""
  model_name: "text-embedding-3-small"
  timeout: 60

# Option to rebuild embeddings when running RAG
rag:
  chroma_dir: "./data/chroma"
  rebuild_embeddings: false
